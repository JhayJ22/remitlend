version: 2

# Dependency update automation for RemitLend (closes #362)
#
# Triage policy:
#   - Security advisories (severity high/critical): dedicated "security" group
#     with a tight 2-day schedule so patches land before the weekly batch.
#   - Routine minor/patch bumps: grouped into a single PR per ecosystem,
#     reviewed on Mondays to keep noise low.
#   - Major version bumps: opened as individual PRs (no group) so they get
#     explicit manual review; they are NOT auto-merged.
#
# Auto-merge signal: PRs in the *-minor-patch and *-security groups receive
# the "automerge" label. A separate GitHub Actions workflow
# (.github/workflows/automerge-dependabot.yml) watches for that label and
# merges PRs that pass all required status checks.
#
# Rollback: Dependabot PRs are individually reversible — merge the revert PR
# generated by the auto-merge workflow, or pin the dependency manually.

updates:
  # ── npm: backend ─────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Security patches get their own group so they are not blocked by a large
    # routine-update PR awaiting review.
    groups:
      backend-security:
        applies-to: security-updates
        patterns:
          - "*"
      backend-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "backend"
    reviewers:
      - "JhayJ22"
    ignore:
      # Major bumps for the Stellar SDK require manual review & contract re-testing.
      - dependency-name: "@stellar/stellar-sdk"
        update-types: ["version-update:semver-major"]

  # ── npm: frontend ─────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"
      frontend-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "frontend"
    reviewers:
      - "JhayJ22"
    ignore:
      # Next.js major upgrades involve breaking changes and require manual migration.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      # React major upgrades affect the whole component tree.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # ── npm: scripts ──────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/scripts"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      scripts-security:
        applies-to: security-updates
        patterns:
          - "*"
      scripts-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "scripts"
    reviewers:
      - "JhayJ22"

  # ── cargo: smart contracts ────────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/contracts"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      contracts-security:
        applies-to: security-updates
        patterns:
          - "*"
      contracts-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "contracts"
      - "rust"
    reviewers:
      - "JhayJ22"
    ignore:
      # soroban-sdk major bumps require contract re-audit and redeployment.
      - dependency-name: "soroban-sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "soroban-token-sdk"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "github-actions"
    reviewers:
      - "JhayJ22"
