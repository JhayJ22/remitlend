# ─── RemitLend CI ─────────────────────────────────────────────────────────────
#
# Issue #409 – split CI into least-privilege reusable workflows.
#
# This orchestrator only declares *which* reusable jobs to run and *when*.
# Each job lives in a dedicated reusable workflow under .github/workflows/
# with the minimum permissions it actually needs (mostly `contents: read`).
#
# Dependency graph:
#   supply-chain-audit ──► money-policy ──► backend
#                                       └──► frontend ──► e2e (+ mobile #406)
#                                       └──► scripts-typecheck
#                       ──► migration-check (path-filtered)
#                       ──► contracts ──► contract-compatibility (#407)
#   boundary-check (#580) ──► backend / frontend / contracts / scripts-typecheck
#   storage-audit (#818) ──► contracts
# ─────────────────────────────────────────────────────────────────────────────
name: RemitLend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Issue #574: run the broader dependency-failure matrix on a scheduled
    # cadence (nightly) in addition to the focused subset on every change.
    - cron: '0 3 * * *'
  workflow_dispatch:

# Deny all permissions at the root level; individual reusable workflows
# declare only what they need (all are contents: read only).
permissions: {}

jobs:
  # ── 0. Architecture boundary check (issue #580) ─────────────────────────────
  # Enforces the allowed/prohibited import map between frontend, backend,
  # contracts, and scripts, and rejects dependency cycles. Runs first so a
  # boundary violation fails fast before the heavier build/test jobs.
  boundary-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Enforce package dependency boundaries
        run: node scripts/check-dependency-boundaries.mjs

  # ── 0b. Storage audit verification (issue #818) ─────────────────────────────
  # Verifies that every `env.storage().persistent().set(...)` call in the
  # contract sources is documented in contracts/STORAGE_AUDIT.md so that
  # undocumented persistent storage cannot silently exceed Soroban rent
  # budgets.
  storage-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Verify every persistent storage key is documented
        run: node scripts/check-storage-audit.mjs

  # ── 1. Supply-chain audit ───────────────────────────────────────────────────
  supply-chain-audit:
    needs: boundary-check
    uses: ./.github/workflows/reusable-supply-chain-audit.yml
    permissions:
      contents: read

  # ── 2. Money-policy drift check ─────────────────────────────────────────────
  money-policy:
    needs: supply-chain-audit
    uses: ./.github/workflows/reusable-money-policy.yml
    permissions:
      contents: read

  # ── 3. Backend lint / build / test ──────────────────────────────────────────
  backend:
    needs: [supply-chain-audit, money-policy]
    uses: ./.github/workflows/reusable-backend.yml
    permissions:
      contents: read

  # ── 3b. Dependency-failure fault-injection suite (issue #574) ───────────────
  # Deterministic, bounded, offline fault-injection tests for RPC, PostgreSQL,
  # and Redis outages (isolated and combined) with recovery convergence.
  #
  # Focused subset runs on every change; the broader matrix runs on the
  # scheduled cadence (and on manual dispatch).
  dependency-failure:
    needs: [supply-chain-audit, money-policy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Focused subset: one representative scenario per dependency plus the
        # combined outage, kept small so it stays fast on every change.
        scenario: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && fromJSON('["rpc","postgres","redis","combined","rpc-recovery","postgres-recovery","redis-recovery","combined-recovery","retry-budget","circuit-state","stale-read","queue-growth"]') || fromJSON('["rpc","postgres","redis","combined"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Run dependency-failure fault-injection suite
        # The suite uses in-process test adapters / a local integration
        # environment only — no public network access is required.
        env:
          DEPENDENCY_FAILURE_SCENARIO: ${{ matrix.scenario }}
          DEPENDENCY_FAILURE_OFFLINE: '1'
        run: npm run test:dependency-failure -- --scenario "$DEPENDENCY_FAILURE_SCENARIO"
        working-directory: backend
      - name: Upload fault-injection logs and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-failure-${{ matrix.scenario }}
          path: backend/test-results/dependency-failure/${{ matrix.scenario }}
          if-no-files-found: ignore
          retention-days: 7

  # ── 4. Migration path filter ─────────────────────────────────────────────────
  # Checks whether backend/migrations/** or backend/package.json changed.
  # The output is consumed by the migration-check job below.
  migration-paths:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            migrations:
              - 'backend/migrations/**'
              - 'backend/package.json'

  # ── 5. Migration round-trip check ────────────────────────────────────────────
  migration-check:
    needs: [supply-chain-audit, migration-paths]
    if: github.event_name == 'push' || needs.migration-paths.outputs.migrations == 'true'
    uses: ./.github/workflows/reusable-migration-check.yml
    permissions:
      contents: read

  # ── 6. Frontend lint / build / test / perf-budget ────────────────────────────
  # Issue #406: mobile performance budget check runs inside this workflow.
  frontend:
    needs: [supply-chain-audit, money-policy]
    uses: ./.github/workflows/reusable-frontend.yml
    permissions:
      contents: read

  # ── 7. Scripts typecheck ─────────────────────────────────────────────────────
  scripts-typecheck:
    needs: supply-chain-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: scripts
      - name: Type check deploy scripts
        run: npm run typecheck
        working-directory: scripts

  # ── 8. Env-docs consistency ──────────────────────────────────────────────────
  env-docs-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Check env docs are in sync
        run: node scripts/check-env-docs.mjs

  # ── 9. Error-code mapping check ──────────────────────────────────────────────
  error-code-mapping-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Check every backend ErrorCode has a frontend message mapping
        run: node scripts/check-error-code-mappings.mjs

  # ── 10. Contributor quick-start verification (issue #582) ────────────────────
  # Runs the documented clean-checkout workflow on a fresh runner so the
  # contributor guide cannot drift from package scripts, required env vars,
  # migrations, seed, and focused test commands. Uses only local/dev values
  # (no production secrets, no external value-bearing transactions).
  contributor-quickstart:
    needs: supply-chain-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Verify contributor quick-start
        run: node scripts/check-contributor-quickstart.mjs
