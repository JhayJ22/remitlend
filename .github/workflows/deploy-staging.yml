name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      drill:
        description: "Run the multi-region DR game-day drill (no production traffic)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write
  issues: write

# Never run two staging deploys at once: both would target the same idle slot.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  # Pinned contract build toolchain (issue #537). A clean checkout with these
  # exact versions must produce byte-identical optimized WASM. Bump these only
  # together with contracts/release-manifest.json (see contracts/REPRODUCIBILITY.md).
  RUST_TOOLCHAIN: "1.81.0"
  WASM_TARGET: "wasm32-unknown-unknown"
  STELLAR_CLI_VERSION: "21.2.0"
  SOROBAN_OPT_VERSION: "21.0.0"
  CONTRACTS_DIR: "contracts"
  RELEASE_MANIFEST: "contracts/release-manifest.json"

jobs:
  # Reproducibility gate: builds optimized WASM from a clean checkout with the
  # pinned toolchain and compares digests against the approved release manifest.
  # Reported as its own job so reproducibility failures are distinct from
  # contract test failures.
  verify-contracts-reproducible:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: |
          set -e
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt
          rustup target add "${WASM_TARGET}" --toolchain "${RUST_TOOLCHAIN}"
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Install pinned Stellar CLI and soroban-opt
        run: |
          set -e
          curl -sSL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin stellar
          curl -sSL "https://github.com/stellar/soroban-opt/releases/download/v${SOROBAN_OPT_VERSION}/soroban-opt-${SOROBAN_OPT_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin soroban-opt
          stellar --version
          soroban-opt --version

      - name: Build optimized WASM artifacts
        run: |
          set -e
          cd "${CONTRACTS_DIR}"
          cargo build --release --target "${WASM_TARGET}"
          mkdir -p target/optimized
          for wasm in target/${WASM_TARGET}/release/*.wasm; do
            name=$(basename "${wasm}")
            soroban-opt optimize --strip-all "${wasm}" "target/optimized/${name}"
          done
          ls -l target/optimized

      - name: Verify artifact digests against release manifest
        run: |
          set -e
          cd "${CONTRACTS_DIR}"
          if [ ! -f "release-manifest.json" ]; then
            echo "::error::release manifest ${RELEASE_MANIFEST} is missing; refusing to proceed"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const path = require("path");
            const manifest = JSON.parse(fs.readFileSync("release-manifest.json", "utf8"));
            const dir = "target/optimized";
            const approved = manifest.artifacts || {};
            const files = fs.readdirSync(dir).filter((f) => f.endsWith(".wasm"));
            if (files.length === 0) {
              console.error("::error::no optimized WASM artifacts were produced");
              process.exit(1);
            }
            let failed = false;
            for (const file of files) {
              const digest = "sha256:" + crypto.createHash("sha256").update(fs.readFileSync(path.join(dir, file))).digest("hex");
              const expected = approved[file];
              if (!expected) {
                console.error(`::error::${file} digest ${digest} is absent from the approved release manifest`);
                failed = true;
              } else if (expected !== digest) {
                console.error(`::error::${file} digest mismatch: built ${digest}, approved ${expected}`);
                failed = true;
              } else {
                console.log(`${file} OK (${digest})`);
              }
            }
            if (failed) {
              console.error("::error::reproducibility check failed; refusing to deploy");
              process.exit(1);
            }
            console.log("All optimized WASM artifacts match the approved release manifest.");
          '

  build-and-push:
    needs: verify-contracts-reproducible
    runs-on: ubuntu-latest
    outputs:
      backend-digest: ${{ steps.push-backend.outputs.digest }}
      frontend-digest: ${{ steps.push-frontend.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backup current staging-latest as staging-previous
        run: |
          set -e
          for img in backend frontend; do
            REPO=ghcr.io/${{ env.OWNER_LC }}/remitlend-${img}
            if docker pull ${REPO}:staging-latest; then
              docker tag ${REPO}:staging-latest ${REPO}:staging-previous || true
              docker push ${REPO}:staging-previous || true
            fi
          done

      - name: Build and push backend
        id: push-backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/remitlend-backend:staging-${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/remitlend-backend:staging-latest
          target: production
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

      - name: Build and push frontend
        id: push-frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/remitlend-frontend:staging-${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/remitlend-frontend:staging-latest
          target: runner

          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_RPC_URL=${{ vars.NEXT_PUBLIC_RPC_URL }}
            NEXT_PUBLIC_NETWORK_PASSPHRASE=${{ vars.NEXT_PUBLIC_NETWORK_PASSPHRASE }}
            NEXT_PUBLIC_EXPLORER_URL=${{ vars.NEXT_PUBLIC_EXPLORER_URL }}
            NEXT_PUBLIC_LENDING_POOL_CONTRACT_ID=${{ vars.NEXT_PUBLIC_LENDING_POOL_CONTRACT_ID || vars.NEXT_PUBLIC_MANAGER_CONTRACT_ID }}
            NEXT_PUBLIC_POOL_CONTRACT_ID=${{ vars.NEXT_PUBLIC_POOL_CONTRACT_ID }}
            NEXT_PUBLIC_GOVERNANCE_CONTRACT_ID=${{ vars.NEXT_PUBLIC_GOVERNANCE_CONTRACT_ID }}
            NEXT_PUBLIC_NFT_CONTRACT_ID=${{ vars.NEXT_PUBLIC_NFT_CONTRACT_ID }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

      - name: Run Trivy vulnerability scanner (HIGH - warn)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ env.OWNER_LC }}/remitlend-backend:staging-${{ github.sha }}'
          format: 'table'
          severity: 'HIGH'
          exit-code: '0'
          trivyignores: '.trivyignore'

      - name: Run Trivy vulnerability scanner (CRITICAL - fail)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ env.OWNER_LC }}/remitlend-backend:staging-${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL'
          exit-code: '1'
          # Without this, trivy-action builds the SARIF with ALL severities and
          # the exit-code then trips on any vulnerability (e.g. the existing
          # HIGH axios advisories) — not just CRITICAL as the step intends.
          # Limiting the report to the requested severity makes the gate fail
          # only on genuine CRITICAL findings.
          limit-severities-for-sarif: 'true'
          trivyignores: '.trivyignore'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy vulnerability scanner for frontend (HIGH - warn)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ env.OWNER_LC }}/remitlend-frontend:staging-${{ github.sha }}'
          format: 'table'
          severity: 'HIGH'
          exit-code: '0'
          trivyignores: '.trivyignore'

      - name: Run Trivy vulnerability scanner for frontend (CRITICAL - fail)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ env.OWNER_LC }}/remitlend-frontend:staging-${{ github.sha }}'
          format: 'sarif'
          output: 'frontend-trivy-results.sarif'
          severity: 'CRITICAL'
          exit-code: '1'
          limit-severities-for-sarif: 'true'
          trivyignores: '.trivyignore'

      - name: Upload frontend Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'frontend-trivy-results.sarif'

      # Sign the staging images with cosign keyless signing (Sigstore / Fulcio).
      # This ensures that only images built by this workflow are accepted as
      # valid staging artifacts, providing supply-chain traceability even for
      # non-release builds.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign staging backend image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            "ghcr.io/${{ env.OWNER_LC }}/remitlend-backend@${{ steps.push-backend.outputs.digest }}"

      - name: Sign staging frontend image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            "ghcr.io/${{ env.OWNER_LC }}/remitlend-frontend@${{ steps.push-frontend.outputs.digest }}"

      - name: Smoke-test the backend staging image
        run: |
          set -e
          REPO=ghcr.io/${{ env.OWNER_LC }}/remitlend-backend
          docker pull "${REPO}:staging-${{ github.sha }}"
          docker run -d --name remitlend-smoke -p 3001:3001 \
            -e NODE_ENV=production \
            "${REPO}:staging-${{ github.sha }}"
          echo "Waiting for /health to report healthy..."
          ok=""
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3001/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 3
          done
          docker logs remitlend-smoke || true
          docker rm -f remitlend-smoke >/dev/null 2>&1 || true
          if [ -z "$ok" ]; then
            echo "::error::backend staging image failed the /health smoke test"
            exit 1
          fi
          echo "Backend staging image passed the /health smoke test."

      - name: Verify PII redaction in staging image
        run: |
          echo "Checking staging image for PII redaction..."
          REPO=ghcr.io/${{ env.OWNER_LC }}/remitlend-backend
          # Pull the image for inspection
          docker pull "${REPO}:staging-${{ github.sha }}"
          # Check that PII redaction env var support is compiled in
          docker run --rm "${REPO}:staging-${{ github.sha }}" grep -r "LOG_REDACTION\|REDACTED\|maskValue\|maskRecipient" /app/dist/ || {
            echo "::warning::PII redaction patterns not found in compiled output - ensure LOG_REDACTION=strict is set in production"
          }
          echo "PII redaction check passed."

  # Non-production multi-region DR game-day drill (issue #570).
  # Runs only on manual dispatch with drill=true, uses sanitized state and
  # production-equivalent config, and never sends real user transactions.
  dr-drill:
    needs: build-and-push
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.drill }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      # Explicit RTO/RPO targets the drill is measured against.
      RTO_TARGET_MINUTES: '60'
      RPO_TARGET_MINUTES: '5'
      # Named incident commander for the drill (override via repo variable).
      INCIDENT_COMMANDER: ${{ vars.DR_INCIDENT_COMMANDER || 'on-call-sre' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Announce drill and incident commander
        run: |
          echo "::notice::DR game-day drill starting. Incident commander: ${INCIDENT_COMMANDER}"
          echo "RTO target: ${RTO_TARGET_MINUTES}m | RPO target: ${RPO_TARGET_MINUTES}m"
          echo "No production traffic will be sent during this drill."

      - name: Restore sanitized database snapshot into standby
        env:
          REHEARSAL_DB_URL: ${{ vars.DR_REHEARSAL_DB_URL || 'postgres://postgres:postgres@localhost:5432/restore_rehearsal' }}
          RESTORE_RTO_TARGET_MINUTES: ${{ env.RTO_TARGET_MINUTES }}
          RESTORE_RPO_TARGET_MINUTES: ${{ env.RPO_TARGET_MINUTES }}
          RESTORE_REHEARSAL_REPORT: ${{ github.workspace }}/restore-rehearsal-report.json
          DR_DRILL_STANDBY_WRITE_BLOCKED: 'true'
        run: |
          set -e
          echo "Restoring sanitized snapshot into standby region..."
          # Sanitized, non-production snapshot only — never production data.
          bash deploy/dr/restore-standby.sh

      - name: Start standby services
        env:
          DR_DRILL_STANDBY_WRITE_BLOCKED: 'true'
        run: |
          set -e
          bash deploy/dr/start-standby.sh

      - name: Recover indexer checkpoint
        env:
          REHEARSAL_DB_URL: ${{ vars.DR_REHEARSAL_DB_URL || 'postgres://postgres:postgres@localhost:5432/restore_rehearsal' }}
        run: |
          set -e
          bash deploy/dr/recover-indexer.sh

      - name: Fail over RPC endpoint
        env:
          DR_STANDBY_STELLAR_RPC_URL: ${{ vars.DR_STANDBY_STELLAR_RPC_URL || '' }}
        run: |
          set -e
          bash deploy/dr/rpc-failover.sh

      - name: Apply DNS/routing change to standby
        run: |
          set -e
          bash deploy/dr/dns-failover.sh

      - name: Verify standby cannot submit transactions
        env:
          DR_DRILL_STANDBY_WRITE_BLOCKED: 'true'
          DR_DRILL_SIGNER_VERIFIED: 'false'
          DR_DRILL_NETWORK_VERIFIED: 'false'
        run: |
          set -e
          # The standby must remain unable to submit until network and signer
          # controls are explicitly verified. A successful submission here is a
          # drill failure.
          bash deploy/dr/verify-fenced.sh

      - name: Reconcile data integrity and record RTO/RPO
        env:
          RESTORE_REHEARSAL_REPORT: ${{ github.workspace }}/restore-rehearsal-report.json
          RESTORE_RTO_TARGET_MINUTES: ${{ env.RTO_TARGET_MINUTES }}
          RESTORE_RPO_TARGET_MINUTES: ${{ env.RPO_TARGET_MINUTES }}
        run: |
          set -e
          bash deploy/dr/reconcile.sh
          echo "RTO target: ${RTO_TARGET_MINUTES}m | RPO target: ${RPO_TARGET_MINUTES}m"

      - name: Upload restore rehearsal report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-drill-restore-rehearsal-report
          path: restore-rehearsal-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail back to primary region
        env:
          RESTORE_REHEARSAL_REPORT: ${{ github.workspace }}/restore-rehearsal-report.json
          DR_DRILL_FAILBACK_CRITERIA: integrity_reconciled,indexer_caught_up,rpc_healthy
        run: |
          set -e
          bash deploy/dr/failback.sh

      - name: Summarize drill and track follow-ups
        if: always()
        run: |
          {
            echo "## Multi-region DR game-day drill (#570)"
            echo ""
            echo "- Incident commander: ${INCIDENT_COMMANDER}"
            echo "- RTO target: ${RTO_TARGET_MINUTES}m | RPO target: ${RPO_TARGET_MINUTES}m"
            echo "- Coverage: database restore, service startup, indexer checkpoint recovery, RPC failover, DNS/routing, failback"
            echo "- Standby transaction fencing verified before any signer/network enablement"
            echo "- Rollback/failback criteria: abort and fail back if integrity reconciliation fails or observed RTO/RPO exceed targets"
            echo "- Follow-up actions from this drill must be tracked to closure"
          } >> "$GITHUB_STEP_SUMMARY"

  canary:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      canary-ok: ${{ steps.synthetic.outputs.ok }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Start canary backend in isolated staging
        run: |
          set -e
          REPO=ghcr.io/${{ env.OWNER_LC }}/remitlend-backend
          docker pull "${REPO}:staging-${{ github.sha }}"
          docker run -d --name remitlend-canary -p 3001:3001 \
            -e NODE_ENV=production \
            -e SYNTHETIC_JOURNEYS=1 \
            "${REPO}:staging-${{ github.sha }}"
          echo "Waiting for canary /health..."
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3001/health >/dev/null 2>&1; then break; fi
            sleep 3
          done

      - name: Contract/API compatibility gate
        id: compat
        run: |
          set -e
          echo "Checking contract/API compatibility for canary..."
          # Fail the gate if the canary cannot serve the contract metadata the
          # frontend depends on. A mismatch blocks promotion.
          if ! curl -fsS http://localhost:3001/api/contracts/metadata >/dev/null 2>&1; then
            echo "::error::contract/API compatibility check failed - blocking promotion"
            exit 1
          fi
          echo "Contract/API compatibility OK."

      - name: Run synthetic financial journeys (read, preview, tx-status)
        id: synthetic
        run: |
          set -e
          echo "Running synthetic journeys against canary (no production funds, no real identities)..."
          # Read flow: list pools with synthetic fixtures.
          curl -fsS http://localhost:3001/api/pools >/dev/null
          # Preview flow: quote a synthetic borrow without submitting.
          curl -fsS -X POST http://localhost:3001/api/loans/preview \
            -H 'content-type: application/json' \
            -d '{"amount":"100","asset":"SYNTH","synthetic":true}' >/dev/null
          # Transaction-status flow: poll a synthetic tx id (never broadcast).
          curl -fsS http://localhost:3001/api/transactions/synthetic-status >/dev/null
          echo "ok=true" >> $GITHUB_OUTPUT
          echo "Synthetic journeys passed."

      - name: Stop canary
        if: always()
        run: docker rm -f remitlend-canary >/dev/null 2>&1 || true

  # Promotion gate: only runs when the canary synthetic journeys and the
  # contract/API compatibility check both pass. Contract deployment approvals
  # remain separately controlled and are not triggered here.
  promote:
    needs: [build-and-push, canary]
    if: ${{ needs.canary.outputs.canary-ok == 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Record deployment evidence
        run: |
          set -e
          mkdir -p deploy/evidence
          cat > deploy/evidence/staging-${{ github.sha }}.json <<EOF
          {
            "commit": "${{ github.sha }}",
            "backend_image_digest": "${{ needs.build-and-push.outputs.backend-digest }}",
            "frontend_image_digest": "${{ needs.build-and-push.outputs.frontend-digest }}",
            "config_version": "${{ vars.STAGING_CONFIG_VERSION }}",
            "gates": {
              "contract_api_compatibility": "passed",
              "synthetic_journeys": "passed"
            }
          }
          EOF
          cat deploy/evidence/staging-${{ github.sha }}.json

      - name: Promote canary to staging-latest
        run: |
          set -e
          for img in backend frontend; do
            REPO=ghcr.io/${{ env.OWNER_LC }}/remitlend-${img}
            docker pull "${REPO}:staging-${{ github.sha }}"
            docker tag "${REPO}:staging-${{ github.sha }}" "${REPO}:staging-latest"
            docker push "${REPO}:staging-latest"
          done
          echo "Promoted staging-${{ github.sha }} to staging-latest."

  # Rollback path: restores the previous image without resubmitting pending
  # chain transactions. Database migrations are forward-compatible, so the
  # previous image can run against the current schema.
  canary-rollback:
    needs: [build-and-push, canary]
    if: ${{ failure() && needs.canary.result == 'failure' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Roll back to staging-previous
        run: |
          set -e
          for img in backend frontend; do
            REPO=ghcr.io/${{ env.OWNER_LC }}/remitlend-${img}
            if docker pull "${REPO}:staging-previous"; then
              docker tag "${REPO}:staging-previous" "${REPO}:staging-latest"
              docker push "${REPO}:staging-latest"
            fi
          done
          echo "::warning::Rolled back to staging-previous. Pending chain transactions were not resubmitted."

  # ── Blue-green deployment (#797) ─────────────────────────────────────────
  # deploy-green → smoke-test → switch-traffic. The idle slot ("green") gets
  # the new image while the live slot ("blue") keeps serving. Traffic moves
  # only after every smoke check passes; the old slot stays running as the
  # rollback target (see rollback-staging.yml for the manual swap back).
  deploy-green:
    needs: [build-and-push, promote]
    if: ${{ vars.STAGING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      slot: ${{ steps.deploy.outputs.slot }}
      live-before: ${{ steps.deploy.outputs.live_before }}
    env:
      SSH_TARGET: ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}
      DEPLOY_DIR: ${{ vars.STAGING_DEPLOY_DIR || '/opt/remitlend' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Configure SSH
        run: |
          set -e
          install -m 700 -d ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.STAGING_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking yes\n' > ~/.ssh/config

      - name: Sync slot compose file to host
        run: |
          set -e
          ssh "$SSH_TARGET" "mkdir -p '$DEPLOY_DIR/deploy/blue-green'"
          scp deploy/blue-green/docker-compose.slot.yml "$SSH_TARGET:$DEPLOY_DIR/deploy/blue-green/"

      - name: Deploy image to idle (green) slot
        id: deploy
        run: |
          set -e
          bg() { ssh "$SSH_TARGET" "DEPLOY_DIR='$DEPLOY_DIR' OWNER='${OWNER_LC}' bash -s -- $*" < scripts/deploy/blue-green.sh; }
          live=$(bg active)
          slot=$(bg deploy "staging-${{ github.sha }}" | tail -n1)
          echo "live_before=${live}" >> "$GITHUB_OUTPUT"
          echo "slot=${slot}" >> "$GITHUB_OUTPUT"
          echo "::notice::Deployed staging-${{ github.sha }} to ${slot}; ${live} still live."

  smoke-test:
    needs: deploy-green
    runs-on: ubuntu-latest
    environment: staging
    env:
      SSH_TARGET: ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}
      DEPLOY_DIR: ${{ vars.STAGING_DEPLOY_DIR || '/opt/remitlend' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure SSH
        run: |
          set -e
          install -m 700 -d ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.STAGING_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking yes\n' > ~/.ssh/config

      # GET /health, GET /healthz/ready, GET /docs.json (valid OpenAPI) and
      # unauthenticated POST /auth/challenge against the green slot directly,
      # before it receives any user traffic.
      - name: Smoke-test green slot
        run: |
          ssh "$SSH_TARGET" "DEPLOY_DIR='$DEPLOY_DIR' bash -s -- smoke '${{ needs.deploy-green.outputs.slot }}'" \
            < scripts/deploy/blue-green.sh

  switch-traffic:
    needs: [deploy-green, smoke-test]
    runs-on: ubuntu-latest
    environment: staging
    env:
      SSH_TARGET: ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}
      DEPLOY_DIR: ${{ vars.STAGING_DEPLOY_DIR || '/opt/remitlend' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure SSH
        run: |
          set -e
          install -m 700 -d ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.STAGING_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking yes\n' > ~/.ssh/config

      - name: Shift traffic to green, keep blue as rollback target
        run: |
          set -e
          ssh "$SSH_TARGET" "DEPLOY_DIR='$DEPLOY_DIR' bash -s -- switch '${{ needs.deploy-green.outputs.slot }}'" \
            < scripts/deploy/blue-green.sh
          {
            echo "## Staging blue-green deploy"
            echo ""
            echo "- Image: \`staging-${{ github.sha }}\`"
            echo "- Live slot: **${{ needs.deploy-green.outputs.slot }}**"
            echo "- Rollback target: **${{ needs.deploy-green.outputs.live-before }}** (run the *Rollback Staging* workflow to swap back)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Smoke tests (or the switch) failed: the previous slot was never taken out
  # of rotation, so it simply stays live. Tear down the bad slot, alert, and
  # mark the run failed.
  deploy-failed:
    needs: [deploy-green, smoke-test, switch-traffic]
    if: ${{ always() && needs.deploy-green.result == 'success' && (needs.smoke-test.result == 'failure' || needs.switch-traffic.result == 'failure') }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      SSH_TARGET: ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}
      DEPLOY_DIR: ${{ vars.STAGING_DEPLOY_DIR || '/opt/remitlend' }}
      SLOT: ${{ needs.deploy-green.outputs.slot }}
      LIVE: ${{ needs.deploy-green.outputs.live-before }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure SSH
        run: |
          set -e
          install -m 700 -d ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.STAGING_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking yes\n' > ~/.ssh/config

      - name: Confirm previous slot is still live
        run: |
          live=$(ssh "$SSH_TARGET" "DEPLOY_DIR='$DEPLOY_DIR' bash -s -- active" < scripts/deploy/blue-green.sh)
          echo "Live slot: ${live} (expected ${LIVE})"
          if [ "$live" != "$LIVE" ]; then
            echo "::error::live slot changed to ${live}; investigate before the next deploy"
          fi

      - name: Collect failed slot logs and tear it down
        run: |
          ssh "$SSH_TARGET" "docker compose -p remitlend-${SLOT} logs --tail=200 backend" || true
          ssh "$SSH_TARGET" "DEPLOY_DIR='$DEPLOY_DIR' bash -s -- teardown '${SLOT}'" < scripts/deploy/blue-green.sh || true

      - name: Alert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_WEBHOOK: ${{ secrets.STAGING_ALERT_WEBHOOK }}
        run: |
          msg="Staging deploy of ${GITHUB_SHA::7} failed smoke tests on slot ${SLOT}; ${LIVE} remains live. ${RUN_URL}"
          echo "::error::${msg}"
          if [ -n "${ALERT_WEBHOOK}" ]; then
            curl -fsS -X POST -H 'content-type: application/json' \
              -d "$(jq -n --arg text "$msg" '{text: $text}')" "${ALERT_WEBHOOK}" || echo "::warning::alert webhook failed"
          fi
          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "Staging deploy failed smoke tests (${GITHUB_SHA::7})" \
            --body "${msg}" --label deploy-failure \
            || gh issue create --repo "${GITHUB_REPOSITORY}" \
                 --title "Staging deploy failed smoke tests (${GITHUB_SHA::7})" --body "${msg}" \
            || echo "::warning::could not open alert issue"

      - name: Mark deployment failed
        run: exit 1
