version: "3.8"
services:
  db:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    security_opt:
      - no-new-privileges:true
    # Drop all Linux capabilities; PostgreSQL only needs DAC_OVERRIDE and
    # CHOWN for its data directory and socket — both are covered by the
    # postgres user owning those paths before the process starts.
    cap_drop:
      - ALL
    # PostgreSQL needs to open its socket and write to /var/run/postgresql;
    # no extra write surface required on the root filesystem.
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Redis only writes to /data (volume-mounted) and /tmp; the rest of the
    # root filesystem is read-only.
    read_only: true
    tmpfs:
      - /tmp

  backend:
    image: ghcr.io/${OWNER}/remitlend-backend:${TAG}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      PII_KEK_ID: ${PII_KEK_ID}
      PII_KMS_ENDPOINT: ${PII_KMS_ENDPOINT}
      PII_KEK_REGION: ${PII_KEK_REGION}
      LOG_REDACTION: strict
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The Node.js backend serves only HTTP; it does not bind to privileged
    # ports or manipulate network interfaces directly. All writes are to
    # the database or Redis; the container root FS is read-only.
    read_only: true
    tmpfs:
      # Node/npm needs a writable /tmp for transient scratch space.
      - /tmp
      # Node's cluster/child_process IPC sockets land in /var/run.
      - /var/run

  frontend:
    image: ghcr.io/${OWNER}/remitlend-frontend:${TAG}
    environment:
      API_URL: http://backend:3001
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Next.js (standalone) writes its cache to .next/cache inside the image;
    # that directory is owned by appuser and can remain on the root FS, but we
    # mount a tmpfs over /tmp for any transient scratch usage.
    read_only: true
    tmpfs:
      - /tmp
      - /var/run

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    # Isolates the db + redis tier from direct external access.
    # Only the backend service bridges frontend ↔ backend networks.
    internal: true

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
